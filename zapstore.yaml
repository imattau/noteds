repository: https://github.com/imattau/noteds
name: Noteds
summary: A peer-to-peer classifieds marketplace built on Nostr
description: |
    Noteds is a browser-first, peer-to-peer classifieds marketplace built on
    the Nostr protocol. Listings, edits, deletions, reviews, and direct
    messages are all Nostr events, so browsing and publishing classifieds
    isn't locked to any single platform or backend.
license: ""
website: https://github.com/imattau/noteds
icon: src-tauri/icons/icon.png
release_source: https://github.com/imattau/noteds
# Release notes: deliberately no release_notes here. zsp v0.5.x publishes a
# release_notes file whole rather than the matching CHANGELOG.md section, so
# the Android workflow writes that section into the GitHub Release body and
# zsp falls back to the body (release_source above).
metadata_sources: []
