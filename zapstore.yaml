repository: https://github.com/imattau/noteds
name: Noteds
summary: A peer-to-peer classifieds marketplace built on Nostr
description: |
    Noteds is a browser-first, peer-to-peer classifieds marketplace built on
    the Nostr protocol. Listings, edits, deletions, reviews, and direct
    messages are all Nostr events, so browsing and publishing classifieds
    isn't locked to any single platform or backend.
