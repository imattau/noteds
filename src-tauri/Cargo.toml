[package]
name = "noteds"
version = "0.0.1"
description = "Noteds: a peer-to-peer classifieds marketplace built on Nostr"
authors = ["noteds"]
license = ""
repository = "https://github.com/imattau/noteds"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
